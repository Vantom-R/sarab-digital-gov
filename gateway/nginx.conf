worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Docker's embedded DNS: resolve upstreams at request time so service restarts are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Real client IP: the host's reverse proxy (reaching us through Docker's port proxy on 172.16/12)
  # overwrites X-Real-IP with the visitor's address. Without this every visitor would share
  # one rate-limit bucket.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  # ---- Rate limiting (per client IP) ----
  # General API: 10 req/s sustained, bursts of 40.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  # Sign-in endpoints: 20 req/min sustained, bursts of 20 (services add their own per-route limits).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Never log query strings or credentials.
  log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # the host's reverse proxy terminates TLS and sets X-Forwarded-Proto; keep it when present.
  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

  server {
    listen 8080;
    limit_conn conn 40;

    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;

    set $jisr      http://jisr:3000;
    set $identity  http://identity:3000;
    set $registry  http://civil-registry:3000;
    set $consent   http://consent:3000;
    set $bank      http://bank-alwaha:3000;
    set $education http://education:3000;
    set $health    http://health:3000;
    set $labor     http://labor:3000;
    set $property  http://property:3000;

    # Phase 6 — early revocation: every API call (except sign-in) is checked against Mithaq's session
    # list, so a revoked session stops working everywhere at once. Anonymous calls pass (services decide).
    location = /_session_check {
      internal;
      proxy_pass $identity/internal/session-check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location @session_revoked {
      include /etc/nginx/security-headers.conf;
      add_header Set-Cookie "sarab_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict" always;
      default_type application/json;
      return 401 '{"error":"session_revoked","message":"This session has been signed out"}';
    }

    # API versioning: apps call /api/v1/<service>/…; it is the same API as /api/<service>/… (which the web
    # portal uses). A breaking change would get /api/v2 while v1 keeps working.
    rewrite ^/api/v1/(jisr|identity|consent|bank)/(.*)$ /api/$1/$2 last;
    location = /api/v1/openapi.json {
      include /etc/nginx/security-headers.conf;
      default_type application/json;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-cache" always;
      alias /usr/share/nginx/openapi/sarab-v1.json;
    }
    location = /api/v1/docs {
      include /etc/nginx/security-headers.conf;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
      default_type text/html;
      alias /usr/share/nginx/openapi/docs.html;
    }
    # Associated domains: lets the future iOS / Android apps use this site's passkeys (served by Mithaq from .env).
    location = /.well-known/apple-app-site-association { limit_req zone=api burst=40 nodelay; proxy_pass $identity; }
    location = /.well-known/assetlinks.json            { limit_req zone=api burst=40 nodelay; proxy_pass $identity; }

    # Sign-in: strict limit + general limit.
    location /api/identity/auth/ {
      limit_req zone=auth burst=20 nodelay;
      limit_req zone=api burst=40 nodelay;
      proxy_pass $identity;
    }

    # Public APIs only. Internal /x/* exchange routes are never routed here.
    location /api/jisr/     { limit_req zone=api burst=40 nodelay; auth_request /_session_check; error_page 401 = @session_revoked; proxy_pass $jisr; }
    location /api/identity/ { limit_req zone=api burst=40 nodelay; auth_request /_session_check; error_page 401 = @session_revoked; proxy_pass $identity; }
    location /api/consent/  { limit_req zone=api burst=40 nodelay; auth_request /_session_check; error_page 401 = @session_revoked; proxy_pass $consent; }
    location /api/bank/     { limit_req zone=api burst=40 nodelay; auth_request /_session_check; error_page 401 = @session_revoked; proxy_pass $bank; }
    location /api/ { default_type application/json; return 404 '{"error":"not_found"}'; }
    # The exchange namespace exists only inside the Docker networks; make that explicit.
    location /x/ { default_type application/json; return 404 '{"error":"not_found"}'; }
    location /internal/ { default_type application/json; return 404 '{"error":"not_found"}'; }

    # OpenAPI docs (Swagger UI needs inline styles/scripts). The ministries expose ONLY their docs.
    location ~ ^/api/(jisr|identity|consent|bank|registry|education|health|labor|property)/docs {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/security-headers.conf;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
      if ($uri ~ ^/api/jisr/)     { proxy_pass $jisr; }
      if ($uri ~ ^/api/identity/) { proxy_pass $identity; }
      if ($uri ~ ^/api/consent/)  { proxy_pass $consent; }
      if ($uri ~ ^/api/bank/)     { proxy_pass $bank; }
      if ($uri ~ ^/api/registry/) { proxy_pass $registry; }
      if ($uri ~ ^/api/education/) { proxy_pass $education; }
      if ($uri ~ ^/api/health/)   { proxy_pass $health; }
      if ($uri ~ ^/api/labor/)    { proxy_pass $labor; }
      if ($uri ~ ^/api/property/) { proxy_pass $property; }
    }

    root /usr/share/nginx/html;
    location /assets/ {
      expires 7d;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, immutable";
    }
    location / {
      try_files $uri $uri/ /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
  }
}
