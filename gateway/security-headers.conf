# Included at server level and again in any location that adds its own headers
# (nginx drops inherited add_header directives when a location defines one).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Public demo with fake data: keep it out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
